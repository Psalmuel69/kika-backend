services:
  # Fronts the api container for every Kika subdomain (api./pay./digest.
  # kikahq.com — see Caddyfile) with automatic Let's Encrypt HTTPS. The
  # api container itself is no longer published on the host (see below)
  # — it's only reachable through Caddy now, so there's no way to
  # accidentally hit it over plain HTTP bypassing TLS.
  # Web UI for container status/health/logs — see portainer.kikahq.com
  # once DNS + Caddy are set up. Needs the Docker socket to observe (and
  # restart, if you use that button) every container on this VM, which
  # makes its own login a high-value target: set a strong password the
  # first time you visit it, and don't publish this port directly (see
  # `expose`, not `ports`, below — same pattern as `api`).
  portainer:
    image: portainer/portainer-ce:lts
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # No host port mapping — only reachable from other containers on
    # this compose network (i.e. from caddy, by service name `api`).
    # If you need direct access for local debugging, temporarily add
    # back `ports: ["8080:8080"]`, but don't leave it on in production
    # alongside Caddy — that would let anyone reach the app directly
    # over plain HTTP, skipping TLS entirely.
    expose:
      - "8080"
    # DATABASE_URL (Neon) and REDIS_URL (Upstash) come from .env
    # unmodified — no PGHOST/REDIS_URL override here. This app doesn't
    # run local Postgres/Redis containers; both live off-VM. See
    # src/config/db.js and src/config/redis.js for how each is
    # auto-selected from DATABASE_URL / REDIS_URL alone.
    env_file: .env
    volumes:
      - receipts-data:/data/receipts
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      WORKER_CONCURRENCY: 10
    volumes:
      - receipts-data:/data/receipts
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  receipts-data:
  caddy-data:
  caddy-config:
  portainer-data:
